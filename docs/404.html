<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found</title>
<meta name="theme-color" content="#1b110b" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: radial-gradient(900px 600px at 50% 30%, #2a1b10, transparent 70%), #1b110b;
    color: #f1e4c9; font: 400 1.0625rem/1.6 system-ui, sans-serif; text-align: center;
  }
  .tube {
    width: min(420px, 100%); aspect-ratio: 16 / 9; margin: 0 auto 28px; border-radius: 18px;
    background:
      repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.05) 0 2px, transparent 2px 4px),
      radial-gradient(circle at 50% 45%, #3a2a1c, #0b0705 75%);
    box-shadow: 0 0 0 12px #4b2a16, 0 0 0 14px #2e190d, 0 30px 60px -20px rgba(0, 0, 0, 0.8);
    display: grid; place-items: center; color: #f3a64a; font: 600 2.2rem/1 Georgia, serif; letter-spacing: 0.04em;
  }
  h1 { font: 600 1.9rem/1.2 Georgia, serif; margin: 0 0 8px; }
  p { margin: 0 0 18px; color: #cdb994; }
  a { color: #1b110b; background: #f3a64a; padding: 10px 20px; border-radius: 999px; text-decoration: none; font-weight: 600; display: inline-block; }
  a:focus-visible { outline: 2px solid #f1e4c9; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="tube" aria-hidden="true">404</div>
  <h1>Nothing on this channel</h1>
  <p>This page doesn't exist. The videos of Tubcal are on the front page.</p>
  <a href="/Tubcal/">Go to the front page</a>
</main>
</body>
</html>
