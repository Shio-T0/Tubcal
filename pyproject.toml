[project]
name = "tubcal"
version = "0.1.0"
description = "Private all-in-one media hub (YouTube, Reddit, Hacker News, anime + a local AI archive) on localhost"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "requests>=2.32",
    "feedparser>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# The Archive (local second brain). Heavy + needs a Python with ML wheels
# (3.12, not the system 3.14) — install with: uv sync --extra brain.
# Ollama is reached over plain HTTP via `requests`, so no client lib here.
brain = [
    "faster-whisper>=1.0",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
