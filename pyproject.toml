[project]
name = "tubcal"
version = "0.1.0"
description = "Private all-in-one social media hub (YouTube + Reddit + Hacker News) on localhost"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "requests>=2.32",
    "feedparser>=6.0",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.14.5",
    "anipy-api>=3.8.21",
    "weeb-cli>=3.0.0",
]

[project.optional-dependencies]
# The Archive (local second brain). Heavy + needs a Python with ML wheels
# (3.12, not the system 3.14) — install with: uv sync --extra brain.
# Ollama is reached over plain HTTP via `requests`, so no client lib here.
brain = [
    "faster-whisper>=1.0",
    "numpy>=1.26",
]
editor = [
    "flask-sock>=0.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
