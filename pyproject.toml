[project]
name = "tubcal"
version = "0.1.0"
description = "Private all-in-one social media hub (YouTube + Reddit + Hacker News) on localhost"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "requests>=2.32",
    "feedparser>=6.0",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.14.5",
]

# Each module's own packages (modules.ini says which module takes which).
[project.optional-dependencies]
# The Archive (local second brain). Heavy + needs a Python with ML wheels
# (3.12, not the system 3.14) — install with: uv sync --extra brain.
# Ollama is reached over plain HTTP via `requests`, so no client lib here.
brain = [
    "faster-whisper>=1.0",
    "numpy>=1.26",
]
editor = [
    "flask-sock>=0.7.0",
]
# The Edition's semantic clusters (without numpy it prints a wire edition).
edition = [
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
# The Anime's scrapers. A group rather than an extra so a plain `uv sync` still
# installs them (default-groups below); install.sh leaves them out with the Anime.
anime = [
    "anipy-api>=3.8.21",
    "weeb-cli>=3.0.0",
]
# Tubcal in the terminal (`python -m tui`). A group so a plain `uv sync` / `uv run`
# brings it; install.sh adds `--group tui` with its `tui` option.
tui = [
    "textual>=8.2,<9",
    "textual-image>=0.14",
    "pillow>=11",
    "httpx>=0.28",
]

[tool.uv]
default-groups = ["dev", "anime", "tui"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
