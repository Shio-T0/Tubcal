# Tubcal's modules: the rooms you can leave out of an install.
#
# install.sh offers each one, `tubcal add` / `tubcal remove` change them later,
# and a module left out has none of its files on disk (install.sh checks the repo
# out sparsely), no Python packages, no server routes and no place in the UI.
# Everything not listed under some module's `paths` is the core and always there.
#
# Read by install.sh, server/modules.py and frontend/src/build/modules.mjs. The
# installer carries a copy of everything here except `paths` (for installs piped
# from curl, which have no checkout yet); tests/test_modules.py keeps them equal.
#
#   name      what the room is called
#   channel   social, coding or video
#   about     one line for the installer's menu
#   aliases   other words `tubcal add` accepts
#   size      roughly what it adds on disk, for the menu
#   needs     modules it can't work without (added with it, removed with them)
#   extras    pyproject extras it installs   groups   pyproject dependency groups
#   tools     private tools the installer sets up for it (yt-dlp)
#   packages  distro packages that help it, taken with the "extras" option
#   paths     the files and folders (ending in /) that belong to it alone
#
# A file used by the core or by two modules stays in the core. The core reaches a
# module only through lazy imports (frontend: lib/modules.js; server: the
# `modules.has()` checks), and tests/test_modules.py fails on a direct import.

[edition]
name = The Edition
channel = social
about = A daily paper composed from the rooms you follow; Ollama writes it up.
aliases = paper
size = 20 MB
needs =
extras = edition
groups =
tools =
packages =
paths =
    server/api/edition.py
    server/brain/cluster.py
    server/brain/edition.py
    server/brain/feed_index.py
    frontend/src/pages/Edition.jsx
    frontend/src/pages/edition.module.css
    frontend/src/components/edition/
    tests/test_edition.py

